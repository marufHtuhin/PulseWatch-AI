# Render Blueprint — PulseWatch AI backend (free tier).
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Render prompts for the `sync: false` values on first deploy:
#   DATABASE_URL — TiDB Cloud MySQL URL (see docs/DEPLOYMENT.md §1).
#                  TLS is auto-configured for *.tidbcloud.com hosts.
#   FRONTEND_URL — the Vercel frontend URL. Deploy the frontend first
#                  if you know the URL, or set a placeholder and update
#                  it after the Vercel deploy (Render restarts on change).
#   SECRET_KEY — random signing key for JWTs (required in production).
#                Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
# The Dockerfile runs `alembic upgrade head` on every start, so the
# tables + migrations (incl. 0003_v4_auth) are created automatically.
# No persistent disk is needed (MySQL holds all state).
services:
  - type: web
    name: pulsewatch-api
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        # JWT signing key. Render prompts for it on first deploy; generate
        # with: python -c "import secrets; print(secrets.token_hex(32))"
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOW_LOCAL_URLS
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MAX_CONCURRENCY
        value: "10"
      - key: PULSEWATCH_TESTING
        value: "0"
